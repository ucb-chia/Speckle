####################################################################
# Host (build-host x86_64) config file for SPEC CPU2006
#
# Used by gen_binaries.sh to compile native binaries on the build
# machine. We never run these binaries — we only need them so SPEC's
# `runspec --action runsetup` populates each benchmark's run/ directory
# with the input files. The target binaries (built with riscv.cfg) are
# then dropped in alongside the inputs by gen_binaries.sh.
#
# This config is deliberately minimal; if your host gcc is too new and
# warns/errors on the older SPEC sources, drop optimization or add
# extra portability flags here.
####################################################################

ignore_errors = yes
tune          = base
basepeak      = yes
ext           = host
output_format = asc,csv

reportable    = no

default=default=default=default:
#####################################################################
# Compiler selection — native build host
#####################################################################

CC  = gcc
CXX = g++
FC  = gfortran

#####################################################################
# Optimization
#####################################################################

default=base=default=default:
COPTIMIZE      = -O0
CXXOPTIMIZE    = -O0
FOPTIMIZE      = -O0

#####################################################################
# 32/64-bit portability — host is 64-bit
#####################################################################

default=base=default=default:
PORTABILITY    = -DSPEC_CPU_LP64

#####################################################################
# Per-benchmark portability flags
# (mirror riscv.cfg so the host build sees the same -D macros)
#####################################################################

400.perlbench=default=default=default:
CPORTABILITY   = -DSPEC_CPU_LINUX_X64 -std=gnu89

416.gamess=default=default=default:
CPORTABILITY   = -funconstrained-commons

462.libquantum=default=default=default:
CPORTABILITY   = -DSPEC_CPU_LINUX

482.sphinx3=default=default=default:
CPORTABILITY   = -fsigned-char

483.xalancbmk=default=default=default:
CXXPORTABILITY = -DSPEC_CPU_LINUX

481.wrf=default=default=default:
CPORTABILITY   = -DSPEC_CPU_CASE_FLAG -DSPEC_CPU_LINUX

#####################################################################
# Notes
#####################################################################

notes_submit_005 = Host build config — used only to materialize input data; not for measurement.
